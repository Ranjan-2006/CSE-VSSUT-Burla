<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | VSSUT CSE</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Syne:wght@400..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--primary);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: var(--surface);
    }
    .login-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 50px 40px;
      border-radius: 8px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .login-logo {
      width: 70px;
      margin-bottom: 20px;
    }
    .login-container h2 {
      font-family: var(--font-display);
      color: var(--surface);
      margin-top: 0;
      margin-bottom: 5px;
      font-size: 2.2rem;
    }
    .login-container p {
      font-family: var(--font-sans);
      color: var(--secondary);
      margin-bottom: 40px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .input-group input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--surface);
      border-radius: 4px;
      font-family: var(--font-sans);
      transition: border-color 0.3s;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--secondary);
    }
    .btn-login {
      width: 100%;
      padding: 15px;
      background: var(--secondary);
      color: var(--primary);
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.3s, opacity 0.3s;
      margin-top: 15px;
    }
    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .back-link {
      display: inline-block;
      margin-top: 30px;
      font-family: var(--font-sans);
      color: var(--muted);
      font-size: 0.85rem;
      transition: color 0.3s;
    }
    .back-link:hover {
      color: var(--surface);
    }
  </style>
</head>
<body>

  <div class="login-container fade-up visible">
    <img src="images/Logo_vssut.svg.png" alt="VSSUT Logo" class="login-logo">
    <h2>Admin Portal</h2>
    <p>Secure System Authentication</p>
    
    <!-- Form skips actual authentication for mockup purposes and resolves to admin.html -->
    <form onsubmit="event.preventDefault(); window.location.href='admin.html';">
      <div class="input-group">
        <label>Username</label>
        <input type="text" placeholder="Enter your username" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login">Login to Dashboard</button>
    </form>
    
    <a href="index.html" class="back-link">&larr; Return to Website</a>
  </div>

</body>
</html>
